<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Berlin cycling accident hotspots 2018–2025</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/Gihotspots250mhexagons_1.js"></script>
        <script src="data/Top20roadsegments_2.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:18, minZoom:10
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topleft'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Berlin cycling accident hotspots 2018–2025</h2>';
        };
        title.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>',
            minZoom: 10,
            maxZoom: 18,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OpenStreetMap_0;
        map.addLayer(layer_OpenStreetMap_0);
        function pop_Gihotspots250mhexagons_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Bike accidents 2018–2025</th>\
                        <td>' + (feature.properties['n_bike'] !== null ? autolinker.link(String(feature.properties['n_bike']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Gi* z-score</th>\
                        <td>' + (feature.properties['gi_z'] !== null ? autolinker.link(String(feature.properties['gi_z']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Hot-spot class</th>\
                        <td>' + (feature.properties['gi_class'] !== null ? autolinker.link(String(feature.properties['gi_class']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Gihotspots250mhexagons_1_0(feature) {
            switch(String(feature.properties['gi_class'])) {
                case 'hot 99%':
                    return {
                pane: 'pane_Gihotspots250mhexagons_1',
                opacity: 1,
                color: 'rgba(255,255,255,0.47058823529411764)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(165,15,21,0.6470588235294118)',
                interactive: true,
            }
                    break;
                case 'hot 95%':
                    return {
                pane: 'pane_Gihotspots250mhexagons_1',
                opacity: 1,
                color: 'rgba(255,255,255,0.47058823529411764)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(222,45,38,0.6470588235294118)',
                interactive: true,
            }
                    break;
                case 'hot 90%':
                    return {
                pane: 'pane_Gihotspots250mhexagons_1',
                opacity: 1,
                color: 'rgba(255,255,255,0.47058823529411764)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(252,146,114,0.6470588235294118)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Gihotspots250mhexagons_1');
        map.getPane('pane_Gihotspots250mhexagons_1').style.zIndex = 401;
        map.getPane('pane_Gihotspots250mhexagons_1').style['mix-blend-mode'] = 'normal';
        var layer_Gihotspots250mhexagons_1 = new L.geoJson(json_Gihotspots250mhexagons_1, {
            attribution: '<a href="https://unfallatlas.statistikportal.de/">Accidents: Unfallatlas, © Statistische Ämter des Bundes und der Länder, dl-de/by-2-0; roads: OSM (ODbL)</a>',
            interactive: true,
            dataVar: 'json_Gihotspots250mhexagons_1',
            layerName: 'layer_Gihotspots250mhexagons_1',
            pane: 'pane_Gihotspots250mhexagons_1',
            onEachFeature: pop_Gihotspots250mhexagons_1,
            style: style_Gihotspots250mhexagons_1_0,
        });
        bounds_group.addLayer(layer_Gihotspots250mhexagons_1);
        map.addLayer(layer_Gihotspots250mhexagons_1);
        function pop_Top20roadsegments_2(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td class="visible-with-data" id="rank" colspan="2"><strong>Rank</strong><br />' + (feature.properties['rank'] !== null ? autolinker.link(String(feature.properties['rank']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Street</th>\
                        <td>' + (feature.properties['street'] !== null ? autolinker.link(String(feature.properties['street']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Ortsteil</th>\
                        <td>' + (feature.properties['ortsteil'] !== null ? autolinker.link(String(feature.properties['ortsteil']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Segment length (m)</th>\
                        <td>' + (feature.properties['length_m'] !== null ? autolinker.link(String(feature.properties['length_m']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Bike accidents 2018–2025</th>\
                        <td>' + (feature.properties['n_bike'] !== null ? autolinker.link(String(feature.properties['n_bike']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Killed or seriously injured</th>\
                        <td>' + (feature.properties['n_killed_serious'] !== null ? autolinker.link(String(feature.properties['n_killed_serious']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Accidents per km</th>\
                        <td>' + (feature.properties['accidents_per_km'] !== null ? autolinker.link(String(feature.properties['accidents_per_km']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Top20roadsegments_2_0() {
            return {
                pane: 'pane_Top20roadsegments_2',
                opacity: 1,
                color: 'rgba(13,54,107,1.0)',
                dashArray: '',
                lineCap: 'round',
                lineJoin: 'round',
                weight: 7.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Top20roadsegments_2');
        map.getPane('pane_Top20roadsegments_2').style.zIndex = 402;
        map.getPane('pane_Top20roadsegments_2').style['mix-blend-mode'] = 'normal';
        var layer_Top20roadsegments_2 = new L.geoJson(json_Top20roadsegments_2, {
            attribution: '<a href="https://unfallatlas.statistikportal.de/">Accidents: Unfallatlas, © Statistische Ämter des Bundes und der Länder, dl-de/by-2-0; roads: OSM (ODbL)</a>',
            interactive: true,
            dataVar: 'json_Top20roadsegments_2',
            layerName: 'layer_Top20roadsegments_2',
            pane: 'pane_Top20roadsegments_2',
            onEachFeature: pop_Top20roadsegments_2,
            style: style_Top20roadsegments_2_0,
        });
        bounds_group.addLayer(layer_Top20roadsegments_2);
        map.addLayer(layer_Top20roadsegments_2);
        var overlaysTree = [
            {label: '<img src="legend/Top20roadsegments_2.png" /> Top 20 road segments', layer: layer_Top20roadsegments_2},
            {label: 'Gi* hot spots (250 m hexagons)<br /><table><tr><td style="text-align: center;"><img src="legend/Gihotspots250mhexagons_1_Gihot99confidence0.png" /></td><td>Gi* hot 99% confidence</td></tr><tr><td style="text-align: center;"><img src="legend/Gihotspots250mhexagons_1_Gihot95confidence1.png" /></td><td>Gi* hot 95% confidence</td></tr><tr><td style="text-align: center;"><img src="legend/Gihotspots250mhexagons_1_Gihot90confidence2.png" /></td><td>Gi* hot 90% confidence</td></tr></table>', layer: layer_Gihotspots250mhexagons_1},
            {label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: 'bm' },]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false, 
        });
        lay.addTo(map);
		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();
        </script>        
    </body>
</html>
